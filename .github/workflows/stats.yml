name: Generate Stats

# STATS_TOKEN(repo 권한 PAT)이 등록되어 있을 때만 자동 갱신합니다.
# 기본 GITHUB_TOKEN은 공개 레포만 볼 수 있어서, 비공개 기여가 빠진 카드로
# 덮어쓰게 됩니다. 토큰이 없으면 로컬에서 생성해 커밋한 카드를 그대로 둡니다.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.STATS_ENABLED == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stat cards
        env:
          # STATS_TOKEN(개인 PAT, repo + read:user)을 등록하면 조직/비공개 기여까지 집계됩니다.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: node .github/scripts/gen-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git diff --staged --quiet || git commit -m "chore: refresh stat cards"
          git push
